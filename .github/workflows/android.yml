name: Build Android APK

# Запускается при каждой загрузке кода в GitHub и по кнопке "Run workflow" во вкладке Actions
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm install

      - name: Сборка веб-части
        run: npm run build

      - name: Создание Android-проекта
        run: npx cap add android

      - name: Иконки приложения
        run: npx @capacitor/assets generate --android --assetPath resources

      - name: Синхронизация
        run: npx cap sync android

      # Постоянный ключ подписи: без него каждая сборка получает новую подпись,
      # и Android не даёт установить обновление поверх прошлой версии.
      - name: Постоянная подпись
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      # Прописываем ключ в сам проект: так Gradle не сможет подставить свой случайный
      - name: Подключение ключа подписи в Gradle
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          block = '''android {
              signingConfigs {
                  debug {
                      storeFile file('../../signing/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          '''
          s2, n = re.subn(r'^android \{\n', block, s, count=1, flags=re.M)
          assert n == 1, 'не нашёл блок android { в build.gradle'
          p.write_text(s2)
          PY

      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Отпечаток подписи (для проверки)
        run: |
          echo "--- ключ из репозитория:"
          keytool -list -keystore signing/debug.keystore -storepass android | tail -2
          echo "--- подпись собранного APK:"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: Equality-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
