name: Build Android APK

# Запускается при каждой загрузке кода в GitHub и по кнопке "Run workflow" во вкладке Actions
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm install

      - name: Сборка веб-части
        run: npm run build

      - name: Создание Android-проекта
        run: npx cap add android

      - name: Иконки приложения
        run: npx @capacitor/assets generate --android --assetPath resources

      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Equality-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
